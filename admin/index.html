<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>RitmixLove — CMS Admin</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b0717; color: #fff; }
    .boot { display: grid; place-items: center; min-height: 100vh; gap: 12px; text-align: center; padding: 24px; }
    .boot p { opacity: .7; max-width: 36ch; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <strong>RitmixLove CMS</strong>
    <p>Загрузка панели редактирования…</p>
  </div>
  <!-- Decap CMS (formerly Netlify CMS) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Hide boot message once CMS mounts
    window.addEventListener("load", function () {
      var boot = document.getElementById("boot");
      if (boot) boot.style.display = "none";
    });
  </script>
</body>
</html>
