<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0717" />
  <title>RitmixLove — Production · Именные песни на заказ</title>
  <meta name="description" content="RitmixLove — Production. Создаём душевные именные песни и музыкальные подарки для дней рождения, свадеб, годовщин, родителей, детей, рекламы и корпоративных гимнов. Студийное качество, срок до 24 часов." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* Brief hold while CMS content loads — avoids empty flash */
    html.cms-loading body > *:not(.bg-layers) { visibility: hidden; }
    html.cms-ready body > * { visibility: visible; }
  </style>
</head>
<body>
  <!-- Decorative background -->
  <div class="bg-layers" aria-hidden="true">
    <div class="orb orb--magenta"></div>
    <div class="orb orb--blue"></div>
    <div class="orb orb--violet"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- ============ HEADER ============ -->
  <header class="site-header" id="top">
    <div class="container nav-bar">
      <a href="#home" class="brand" aria-label="RitmixLove — Production, на главную">
        <img src="LOGO.png" alt="" class="brand__logo" width="38" height="38" />
        <span class="brand__text">RitmixLove<span class="brand__text--sub"> - Production</span></span>
      </a>

      <nav class="nav-links" aria-label="Основная навигация">
        <!-- filled by cms.js -->
      </nav>

      <a href="#" target="_blank" rel="noopener" class="btn btn--primary btn--sm nav-cta">
        Заказать песню
      </a>

      <button class="nav-toggle" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobileMenu">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="mobile-menu" id="mobileMenu">
      <!-- filled by cms.js -->
    </div>
  </header>

  <main>
    <!-- ============ HERO ============ -->
    <section class="hero" id="home">
      <div class="container hero__inner">
        <div class="hero__content">
          <!-- filled by cms.js from content/site.json -->
        </div>
      </div>
    </section>

    <!-- ============ ADVANTAGES ============ -->
    <section class="section section--tight" id="advantages">
      <div class="container">
        <div class="cards-grid cards-grid--6" id="cms-advantages">
          <!-- filled by cms.js -->
        </div>
      </div>
    </section>

    <!-- ============ WHAT WE CREATE ============ -->
    <section class="section" id="create">
      <div class="container">
        <div class="section__head reveal" id="cms-categories-head">
          <!-- filled by cms.js -->
        </div>
        <div class="cards-grid cards-grid--3" id="cms-categories">
          <!-- filled by cms.js -->
        </div>
      </div>
    </section>

    <!-- ============ EXAMPLES / PORTFOLIO ============ -->
    <section class="section section--alt" id="portfolio">
      <div class="container">
        <div class="section__head reveal" id="cms-portfolio-head">
          <!-- filled by cms.js -->
        </div>

        <div class="works-list" id="worksList">
          <!-- filled by cms.js -->
        </div>

        <div class="works__more reveal">
          <a href="#" class="works__more-link" id="loadMore">Слушать больше примеров →</a>
        </div>
      </div>
    </section>

    <!-- ============ YOUTUBE / РЕЛИЗЫ ============ -->
    <section class="section" id="youtube">
      <div class="container">
        <div class="section__head reveal" id="cms-youtube-head">
          <!-- filled by cms.js -->
        </div>

        <div class="yt-carousel reveal">
          <button class="yt-arrow yt-arrow--prev" id="ytPrev" aria-label="Предыдущее видео" disabled>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <div class="yt-viewport">
            <div class="yt-track" id="ytTrack" aria-live="polite">
              <div class="yt-status" id="ytStatus">
                <span class="yt-status__spinner" aria-hidden="true"></span>
                <span>Загрузка видео с YouTube…</span>
              </div>
            </div>
          </div>

          <button class="yt-arrow yt-arrow--next" id="ytNext" aria-label="Следующее видео" disabled>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="yt-cta reveal">
          <a href="https://www.youtube.com/@RitmixLOVE/" target="_blank" rel="noopener" class="btn btn--youtube">
            Подписаться на YouTube-канал
          </a>
        </div>
      </div>
    </section>

    <!-- ============ PRICING ============ -->
    <section class="section" id="pricing">
      <div class="container">
        <div class="section__head reveal" id="cms-pricing-head">
          <!-- filled by cms.js -->
        </div>
        <div class="pricing-grid" id="cms-pricing">
          <!-- filled by cms.js -->
        </div>
      </div>
    </section>

    <!-- ============ HOW TO ORDER ============ -->
    <section class="section section--alt" id="process">
      <div class="container">
        <div class="section__head reveal" id="cms-process-head">
          <!-- filled by cms.js -->
        </div>
        <div class="steps" id="cms-steps">
          <!-- filled by cms.js -->
        </div>
      </div>
    </section>

    <!-- ============ REVIEWS ============ -->
    <section class="section" id="reviews">
      <div class="container">
        <div class="section__head reveal" id="cms-reviews-head">
          <!-- filled by cms.js -->
        </div>

        <div class="reviews-carousel reveal">
          <div class="reviews-viewport">
            <div class="reviews-track" id="reviewsTrack">
              <!-- filled by cms.js -->
            </div>
          </div>

          <div class="reviews-controls">
            <button class="carousel-btn" id="reviewPrev" aria-label="Предыдущий отзыв">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="reviews-dots" id="reviewDots" aria-hidden="true"></div>
            <button class="carousel-btn" id="reviewNext" aria-label="Следующий отзыв">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CTA ============ -->
    <section class="cta-band" id="cta">
      <div class="container cta-band__inner reveal">
        <h2 class="cta-band__title"></h2>
        <p class="cta-band__sub"></p>
        <div class="cta-band__actions">
          <!-- filled by cms.js -->
        </div>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer" id="contacts">
    <div class="container site-footer__grid">
      <div class="footer-col footer-col--about">
        <a href="#home" class="brand brand--footer">
          <img src="LOGO.png" alt="" class="brand__logo" width="34" height="34" />
          <span class="brand__text">RitmixLove<span class="brand__text--sub"> - Production</span></span>
        </a>
        <p class="footer-about"></p>
        <div class="footer-socials">
          <!-- filled by cms.js -->
        </div>
      </div>

      <nav class="footer-col" aria-label="Навигация">
        <!-- filled by cms.js -->
      </nav>

      <nav class="footer-col" aria-label="Услуги">
        <!-- filled by cms.js -->
      </nav>

      <div class="footer-col">
        <!-- filled by cms.js -->
      </div>
    </div>

    <div class="container site-footer__bottom">
      <!-- filled by cms.js -->
    </div>
  </footer>

  <!-- Floating WhatsApp quick-contact button -->
  <a href="#" target="_blank" rel="noopener" class="fab-whatsapp" aria-label="Написать в WhatsApp">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.607zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
    <span class="fab-whatsapp__pulse" aria-hidden="true"></span>
  </a>

  <!-- YouTube video modal (lightbox) -->
  <div class="yt-modal" id="ytModal" hidden>
    <div class="yt-modal__backdrop" id="ytModalBackdrop"></div>
    <div class="yt-modal__dialog" role="dialog" aria-modal="true" aria-label="Видео YouTube">
      <button class="yt-modal__close" id="ytModalClose" aria-label="Закрыть видео">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="yt-modal__frame" id="ytModalFrame"></div>
    </div>
  </div>

  <!-- CMS loader applies content/site.json, then loads script.js + youtube.js -->
  <script src="cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
